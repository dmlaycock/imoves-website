name: Deploy to Cloudflare Pages

# Production: every push to the `production` branch deploys the live site to the Cloudflare Pages
# project `imoves-website` (imoves-website.pages.dev, later imoves.com). Pushes to `main` deploy a
# preview at main.imoves-website.pages.dev. Run from the Actions tab to deploy any branch by hand.
# Secrets (repo Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN (Account >
# Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [production, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build upload folder (live site only, _redirects, size checks)
        run: python3 tools/build-dist.py dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create the Pages project if it does not exist yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project list 2>/dev/null | grep -q '^| imoves-website ' \
            || npx --yes wrangler@3 pages project create imoves-website --production-branch production

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy dist --project-name imoves-website --branch "${{ github.ref_name }}" --commit-dirty=true | tee deploy.log
          echo "## Cloudflare Pages deploy (${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
