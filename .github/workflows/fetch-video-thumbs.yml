name: Fetch video thumbnails from Wistia

# Version C, one-off: downloads the 73 marketing-video thumbnails into video/thumbs/ and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python tools/fetch-thumbs.py
      - name: Commit thumbnails
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add video/thumbs
          git diff --cached --quiet || git commit -m "Version C: video thumbnails fetched from Wistia"
          git push
